# El token de Instagram vence a los 60 días. Este flujo lo renueva cada lunes y
# actualiza el secreto IG_ACCESS_TOKEN. Requiere el secreto GH_PAT: un token de GitHub
# (fine-grained) de este repositorio con permiso "Secrets: Read and write".
name: Renovar token de Instagram

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar y guardar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then
            echo "Faltan los secretos IG_ACCESS_TOKEN o GH_PAT: no hay nada que renovar."
            exit 0
          fi
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN" | jq -r .access_token)
          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then echo "No se pudo renovar el token"; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
