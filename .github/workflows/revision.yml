# Revisión semanal autónoma: analiza las métricas, ajusta config.json dentro de rangos seguros,
# guarda el reporte en reportes/ y abre un issue para avisar.
name: Revisión semanal

on:
  schedule:
    - cron: "11 13 * * 1"  # lunes 10:11 Chile
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar        # no corre mientras se está publicando
  cancel-in-progress: false

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Métricas al día
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python metrics.py

      - name: Revisión
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python revision.py

      - name: Guardar
        run: |
          git config user.name "pasefiltrado-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "revisión semanal $(date -u +%F)"
          git pull --rebase --autostash -q
          git push
