# Publica en Instagram según horario. Horas en UTC; Chile en horario de verano es UTC-3
# (en invierno, UTC-4, todo sale una hora antes).
name: Publicar

on:
  schedule:
    - cron: "0 12 * * *"         # 09:00 Chile · previa del partido del día (o agenda)
    - cron: "0 16 * * *"         # 13:00 Chile · noticia
    - cron: "0 21 * * *"         # 18:00 Chile · noticia
    - cron: "30 2 * * *"         # 23:30 Chile · carrusel "La fecha en 1 minuto"
    - cron: "*/15 12-23 * * *"   # 09:00–20:59 Chile · monitor: resultado al instante y última hora
    - cron: "*/15 0-3 * * *"     # 21:00–00:59 Chile · monitor
  workflow_dispatch:
    inputs:
      slot:
        description: "Horario a ejecutar"
        type: choice
        options: [verificar, manana, noticias, monitor, resultados]
        default: monitor

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      HAS_IG: ${{ secrets.IG_ACCESS_TOKEN != '' }}
    steps:
      # Sin Instagram configurado, los horarios automáticos no generan nada (no se acumula una cola
      # que se publicaría de golpe al conectar la cuenta). Las ejecuciones manuales sí generan, para probar.
      - name: Comprobar configuración
        id: check
        run: |
          if [ "${{ inputs.slot }}" = "verificar" ]; then
            echo "run=check" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$HAS_IG" != "true" ]; then
            echo "Instagram aún no está configurado: no se genera nada."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.run != 'false'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run != 'false'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.check.outputs.run != 'false'

      # Opción manual "verificar": comprueba el token y la cuenta sin generar ni publicar nada
      - name: Verificar conexión con Instagram
        if: steps.check.outputs.run == 'check'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish.py --check

      - name: Elegir horario
        if: steps.check.outputs.run == 'true'
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * *") SLOT=manana ;;
            "0 16 * * *"|"0 21 * * *") SLOT=noticias ;;
            "30 2 * * *") SLOT=resultados ;;
            "") SLOT="${{ inputs.slot }}" ;;
            *) SLOT=monitor ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Generar posts
        if: steps.check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py --slot ${{ steps.slot.outputs.slot }}

      # Instagram descarga la imagen desde una URL pública: primero se sube al repo
      - name: Subir imágenes
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "pasefiltrado-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "posts ${{ steps.slot.outputs.slot }} $(date -u +%F)"
          git push

      - name: Publicar en Instagram
        if: steps.check.outputs.run == 'true' && env.HAS_IG == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python publish.py

      - name: Guardar historial
        if: steps.check.outputs.run == 'true'
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "historial $(date -u +%F)"
          git push
